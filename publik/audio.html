<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Audio</title>
    <style>
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            padding: 10px;
        }

        
        header {
            background-color: #222222; 
            padding: 25px 15px; 
            margin-bottom: 10px;
            border-radius: 4px; 
        }

        header h1 {
            font-size: 2rem;
            color: #ffffff; 
        }

        
        .main-container {
            display: flex; 
            margin-bottom: 10px;
            min-height: 400px; 
        }

        
        nav {
            background-image: repeating-linear-gradient(0deg, rgb(163, 163, 163) 0px, rgb(163, 163, 163) 1px,transparent 1px, transparent 21px),repeating-linear-gradient(90deg, rgb(163, 163, 163) 0px, rgb(163, 163, 163) 1px,transparent 1px, transparent 21px),linear-gradient(90deg, hsl(334,0%,62%),hsl(334,0%,62%));
            width: 150px; 
            padding: 15px;
            margin-right: 10px; 
            border-radius: 4px; 
        }

        nav ul {
            list-style-type: none; 
        }

        nav ul li a {
            color: #2c3e50; 
            text-decoration: underline;
            background: transparent;
            font-weight: bold;
        }

        
        section {
            border: 2px solid black; 
            flex: 1; 
            padding: 20px;
            border-radius: 4px;
        }

        
        audio {
            display: block;
            margin-top: 10px;
            width: 100%;
            max-width: 320px; 
        }

        
        footer {
            background-color: #222222; 
            padding: 30px 15px; 
            min-height: 80px; 
            border-radius: 4px; 
            color: #ffffff; 
        }
    </style>
</head>
<body>

    
    <header>
        <h1>Halaman audio</h1>
    </header>

    
    <div class="main-container">
        
        
        <nav>
            <ul>
                <li><a href="index.html">Kembali</a></li>
            </ul>
        </nav>
        
        
        <section>
           
            <audio controls>
                <source src="disini.mp3" type="audio/mpeg">
                Browser Anda tidak mendukung pemutar audio.
            </audio>
        </section>
        
    </div>

    
    <footer>
        thx for read my text
    </footer>

</body>
</html>
